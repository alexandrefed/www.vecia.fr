# Docker Compose configuration for Vecia Astro SSR application
# Production deployment on new VPS with Caddy reverse proxy

services:
  vecia-website:
    image: vecia-website:latest

    container_name: vecia-website

    restart: unless-stopped

    # Connect to caddy network (Caddy handles routing via Caddyfile)
    networks:
      - caddy-public

    # Environment variables (runtime)
    environment:
      - HOST=0.0.0.0
      - PORT=4322
      - NODE_ENV=production
      # Comments. Secrets are passed by NAME only: infisical-run injects them into the shell that runs `docker compose up`.
      - ANTHROPIC_API_KEY
      - IP_HASH_SALT
      - MODERATION_HMAC_KEY
      - NTFY_TOKEN
      - COMMENTS_DB_PATH=/data/comments.db
      - MODERATION_MODE=${MODERATION_MODE:-shadow}
      - NTFY_URL=https://ntfy.vecia.fr
      - NTFY_TOPIC=alex-alerts
      - SITE_URL=https://vecia.fr

    # SQLite comment database
    volumes:
      - vecia-comments:/data

    # Expose port (Caddy handles SSL termination)
    expose:
      - "4322"

    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4322/api/health.json', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    # Security options
    security_opt:
      - no-new-privileges:true

# Define volumes
volumes:
  vecia-comments:

# Define networks
networks:
  caddy-public:
    external: true
